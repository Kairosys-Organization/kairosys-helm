{{- if .Values.gateway.enabled }}
{{- /*
  ALB target-group health checks, one per Service that the Gateway actually
  routes to. Driven by .Values.gateway.healthCheck so the set can't drift from
  the real backends the way a hardcoded list does.

  Two things this fixes:

  * The controller defaults to `/` every 15s. On user-hub `/` is the CreditFlow
    dashboard, so each check rendered the page and ran its SQL aggregates —
    ~5,760 times a day, emitting a ~9-span trace each time, purely to prove the
    container was alive.

  * otel-collector's target group was checking `/` on the OTLP HTTP port, which
    answers 404, so all three targets sat unhealthy. Ingest kept working only
    because an ALB fails open when *every* target is unhealthy — the moment one
    passed, the rest would have been dropped from rotation. It now accepts
    200-499, since a 404 from the OTLP endpoint still proves the collector is
    listening and serving HTTP.
*/}}
{{- range $svc, $cfg := .Values.gateway.healthCheck }}
---
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: {{ $svc }}
  labels:
    app: {{ $svc }}
spec:
  targetReference:
    kind: Service
    name: {{ $svc }}
  defaultConfiguration:
    healthCheckConfig:
      healthCheckProtocol: HTTP
      healthCheckPath: {{ $cfg.path | default "/" | quote }}
      healthCheckInterval: {{ $cfg.interval | default 60 }}
      healthCheckTimeout: {{ $cfg.timeout | default 5 }}
      healthyThresholdCount: {{ $cfg.healthyThreshold | default 2 }}
      unhealthyThresholdCount: {{ $cfg.unhealthyThreshold | default 3 }}
      matcher:
        httpCode: {{ $cfg.httpCode | default "200-399" | quote }}
{{- end }}
{{- end }}

{{- if .Values.opsAgent.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-agent
  labels:
    app: ops-agent
data:
{{- range $k, $v := .Values.opsAgent.config }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- if .Values.opsAgent.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ops-agent
  labels:
    app: ops-agent
type: Opaque
stringData:
{{- range $k, $v := .Values.opsAgent.secrets }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-agent
  labels:
    app: ops-agent
spec:
  replicas: {{ .Values.opsAgent.replicaCount }}
  selector:
    matchLabels:
      app: ops-agent
  template:
    metadata:
      labels:
        app: ops-agent
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      # Block ops-agent boot until postgres is ready. Prevents the silent
      # "Studio API failed to register" race — ops-agent's Flask init hits
      # the DB during import; if postgres is mid-restart, the exception is
      # swallowed and every /api/* request 404s until the pod is restarted.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - 'until pg_isready -h postgres -U pathfinder -d pathfinder; do echo "waiting for postgres..."; sleep 2; done'
      containers:
        - name: ops-agent
          image: "{{ .Values.opsAgent.image.repository }}:{{ .Values.opsAgent.image.tag }}"
          imagePullPolicy: {{ .Values.opsAgent.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: ops-agent
            - secretRef:
                name: ops-agent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 4313
              name: grpc
              protocol: TCP
          # /health returns 200 even when /api/* isn't registered — useless
          # as a liveness signal. Probe a real API route instead. Both 200
          # (registered + unauth-not-required) and 401 (registered + needs
          # auth) mean the API is up. 404 = the exact broken state → restart.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  code=$(wget -qO- -T 3 --server-response http://localhost:8080/api/crews 2>&1 \
                          | awk '/HTTP\//{print $2; exit}')
                  case "$code" in 200|401) exit 0 ;; *) exit 1 ;; esac
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          resources: {{- toYaml .Values.opsAgent.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ops-agent
  labels:
    app: ops-agent
spec:
  type: ClusterIP
  selector:
    app: ops-agent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 4313
      targetPort: 4313
      protocol: TCP
{{- end }}
